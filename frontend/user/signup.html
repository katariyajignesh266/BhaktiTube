<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>BhaktiTube Signup</title>

<link rel="stylesheet" href="../theme-system.css">
<link rel="stylesheet" href="user.css">

</head>
<body>

    <div class="auth-close">

<a href="../index.html">

✕

</a>

</div>

<div class="auth-container">


    <div class="logo">
        📺
    </div>

    <h1>
        Create Account
    </h1>

    <input
    type="text"
    id="name"
    placeholder="Full Name">

    <input
    type="email"
    id="email"
    placeholder="Email Address">

    <input
    type="password"
    id="password"
    placeholder="Password">

    <button id="signupBtn">
        Create Account
    </button>

    <button id="googleSignupBtn"
    class="google-btn">

        Continue With Google

    </button>

    <p class="switch-page">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>

</div>

<script type="module" src="signup.js"></script>

</body>
</html>
