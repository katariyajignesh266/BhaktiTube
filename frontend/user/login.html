<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>BhaktiTube Login</title>

<link rel="stylesheet" href="../theme-system.css">
<link rel="stylesheet" href="../responsive-system.css">
<link rel="stylesheet" href="user.css">

</head>

<body>

<div class="auth-close">

<a href="../index.html">

✕

</a>

</div>

<div class="auth-container">

    <div class="logo">
        📺
    </div>

    <h1>
        Welcome Back
    </h1>

    <input
    type="email"
    id="email"
    placeholder="Email Address">

    <input
    type="password"
    id="password"
    placeholder="Password">

    <button id="loginBtn">
        Login
    </button>

    <button
    id="googleLoginBtn"
    class="google-btn">

        Continue With Google

    </button>

    <p class="switch-auth">

        Don't have an account?

        <a href="signup.html">
            Signup
        </a>

    </p>

</div>

<script
type="module"
src="login.js">
</script>

</body>

</html>
