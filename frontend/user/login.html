user-scalable=no,
viewport-fit=cover">

<link rel="apple-touch-icon" sizes="144x144" href="../icons/icon-144x144.png">
<link rel="apple-touch-icon" sizes="128x128" href="../icons/icon-128x128.png">

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="512x512" href="../icons/icon-512x512.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192x192.png">
<link rel="shortcut icon" href="../icons/icon-192x192.png">

<title>BhaktiTube Login</title>

<link rel="stylesheet" href="../theme-system.css">
<link rel="stylesheet" href="../responsive-system.css">
<link rel="stylesheet" href="user.css">

<!-- PWA CSS -->
<link rel="stylesheet" href="../install-manager.css">
<link rel="stylesheet" href="../update-manager.css">
<link rel="stylesheet" href="../network-manager.css">

<link rel="icon"
href="https://res.cloudinary.com/dastne5qy/image/upload/q_auto/f_auto/v1780742623/My_Bhaktitude_website_logo_gxf2b1.png" />

</head>

<body>

<div class="auth-close">

<a href="../index.html">

✕

</a>

</div>

<div class="auth-container">

    <div class="logo">
        📺
    </div>

    <h1>
        Welcome Back
    </h1>

    <input
    type="email"
    id="email"
    placeholder="Email Address">

    <input
    type="password"
    id="password"
    placeholder="Password">

    <button id="loginBtn">
        Login
    </button>

    <button
    id="googleLoginBtn"
    class="google-btn">

        Continue With Google

    </button>

    <p class="switch-auth">

        Don't have an account?

        <a href="signup.html">
            Signup
        </a>

    </p>

</div>

<!-- PWA Scripts -->
<script src="../sw-register.js"></script>
<script src="../install-manager.js"></script>
<script src="../update-manager.js"></script>
<script src="../network-manager.js"></script>

<script
type="module"
src="login.js">
</script>

</body>

</html>
