<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta
name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BhaktiTube">
    <meta name="theme-color" content="#FF6B35">
    <meta name="msapplication-TileColor" content="#FF6B35">
    
    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://res.cloudinary.com">
    <link rel="dns-prefetch" href="https://www.youtube.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/frontend/manifest.json">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/frontend/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/frontend/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/frontend/icons/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="128x128" href="/frontend/icons/icon-128x128.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="512x512" href="/frontend/icons/icon-512x512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/frontend/icons/icon-192x192.png">
    <link rel="shortcut icon" href="/frontend/icons/icon-192x192.png">
    
    <title>Channel</title>
    <link rel="stylesheet" href="theme-system.css">
    <link rel="stylesheet" href="responsive-system.css">
    <link rel="stylesheet" href="viewport-fix.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="channel.css">
    
    <!-- PWA CSS -->
    <link rel="stylesheet" href="install-manager.css">
    <link rel="stylesheet" href="update-manager.css">
    <link rel="stylesheet" href="network-manager.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="back-home" onclick="goHome()">
    <i class="fa-solid fa-arrow-left"></i>
</div>

<div class="channel-header">
    <img id="channelLogo" alt="Logo">
    <h1 id="channelName" style="font-size: 20px !important; margin-bottom: 5px;"></h1>
    <p id="channelSubscribers" style="font-size: 14px !important; margin: 2px 0; color: #aaa;"></p>
    <p id="channelVideos" style="font-size: 14px !important; margin: 2px 0; color: #aaa;"></p>
</div>

<div id="channelVideosContainer"></div>
<div id="loader" class="loader"></div>
<div id="loadMoreTrigger"></div>

<!-- REDESIGNED PREMIUM LUXURY ADVERTISEMENT POPUP -->
<div id="adPopup" class="ad-popup">
  <div class="ad-content-card">
    <div class="ad-media-container">
      <video id="adVideo" playsinline autoplay></video>
      <div class="ad-progress-container">
        <div class="ad-progress-bar" id="adProgressBar"></div>
      </div>
      <div class="ad-badge">Sponsored</div>
    </div>
    <div class="ad-details-container">
      <div class="ad-info">
        <h2 id="adTitleText" class="ad-title">Sponsored Advertisement</h2>
        <p id="adDescText" class="ad-description">Support our sponsors to continue enjoying free devotional content.</p>
      </div>
      <div class="ad-actions">
        <button id="visitAdBtn" class="ad-btn-primary">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> Visit Website
        </button>
        <button id="skipAdBtn" class="ad-btn-secondary" disabled>
          Skip Ad (5)
        </button>
      </div>
    </div>
  </div>
</div>

<div id="videoPopup" class="video-popup">
    <div class="popup-content">
        <div class="video-container" id="videoContainer" onclick="handleOverlayTouch()">
            <iframe id="youtubePlayer" src="" allow="autoplay; fullscreen"></iframe>
            
            <div id="customOverlay" class="custom-overlay">
                
                <div class="player-top-bar">
                    <button class="player-btn-round top-back-btn" onclick="event.stopPropagation(); closeVideo();">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <span class="video-title-mini">Playing Video...</span>
                </div>

                <div class="middle-skip-controls">
                    <button class="skip-btn-center backward-btn" onclick="event.stopPropagation(); skipTime(-10)">
                        <i class="fa-solid fa-undo"></i>
                        <span class="btn-text">10s</span>
                    </button>
                    <button class="skip-btn-center forward-btn" onclick="event.stopPropagation(); skipTime(10)">
                        <i class="fa-solid fa-redo"></i>
                        <span class="btn-text">10s</span>
                    </button>
                </div>

                <div class="player-bottom-controls" onclick="event.stopPropagation();">
                    
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>

                    <div class="controls-row">
                        <div class="controls-left">
                            <button class="player-btn-round" id="muteBtn" onclick="toggleMute()">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>

                        <div class="controls-center">
                            <span id="currentTime">00:00</span>
                            <span class="time-separator">/</span>
                            <span id="totalTime">00:00</span>
                        </div>

                        <div class="controls-right">
                            <div class="speed-control">
                                <button class="player-btn-rect" onclick="toggleSpeedMenu()">
                                    <i class="fa-solid fa-gauge-high"></i> <span id="speedTxt">1x</span> <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i>
                                </button>
                                <div id="speedMenu" class="speed-menu">
                                    <div onclick="changeSpeed(0.5)">0.5x</div>
                                    <div onclick="changeSpeed(1)">Normal</div>
                                    <div onclick="changeSpeed(1.5)">1.5x</div>
                                    <div onclick="changeSpeed(2)">2x</div>
                                </div>
                            </div>

                            <button class="player-btn-round fullscreen-btn" id="fsBtn" onclick="toggleFullScreen()">
                                <i class="fa-solid fa-expand"></i>
                            </button>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- PWA Scripts -->
<script src="sw-register.js"></script>
<script src="install-manager.js"></script>
<script src="update-manager.js"></script>
<script src="network-manager.js"></script>

<script src="https://www.youtube.com/iframe_api"></script>
<script type="module" src="channel.js"></script>

<script>
    function goHome() {
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
