<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BhaktiTube Login</title>

<link rel="stylesheet" href="user.css">

</head>

<body>

<div class="auth-container">

    <div class="logo">
        📺
    </div>

    <h1>
        Welcome Back
    </h1>

    <input
    type="email"
    id="email"
    placeholder="Email Address">

    <input
    type="password"
    id="password"
    placeholder="Password">

    <button id="loginBtn">
        Login
    </button>

    <button
    id="googleLoginBtn"
    class="google-btn">

        Continue With Google

    </button>

    <p class="switch-auth">

        Don't have an account?

        <a href="signup.html">
            Signup
        </a>

    </p>

</div>

<script
type="module"
src="login.js">
</script>

</body>

</html>
