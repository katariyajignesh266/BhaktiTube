<!DOCTYPE html>
<html>

<head>

<title>Channel</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="channel.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

  <div class="back-home" onclick="goHome()">
    <i class="fa-solid fa-arrow-left"></i>
</div>

<div class="channel-header">

<img id="channelLogo">

<h1 id="channelName"></h1>

<p id="channelSubscribers"></p>

<p id="channelVideos"></p>

</div>

<div id="channelVideosContainer"></div>

<div id="loader" class="loader"></div>

<div id="loadMoreTrigger"></div>

<div id="videoPopup" class="video-popup">

  <div class="popup-content">

    <span class="channel-close-btn"
          onclick="closeVideo()">
      ✕
    </span>

    <iframe
id="youtubePlayer"
allowfullscreen
allow="
autoplay;
fullscreen;
accelerometer;
clipboard-write;
encrypted-media;
gyroscope;
picture-in-picture;
web-share">
</iframe>

  </div>

</div>

<script type="module" src="channel.js"></script>

</body>

</html>
