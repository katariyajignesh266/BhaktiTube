<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>BhaktiTube</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css"/>

  <!-- ICONS -->
  <link
    rel="icon"
    href="./Image/Youtube logo...webp"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
</head>

<body>





  <!-- HEADER -->

  <header class="header">

    <div class="left-header">

      <i class="fa-solid fa-bars"></i>

      <div class="logo">

        <i class="fa-brands fa-youtube"></i>

        <span>BhaktiTube</span>

      </div>

    </div>



    <div class="right-header">

      <div class="search-overlay" id="searchOverlay">

    <div class="search-wrapper">

        <input
        type="text"
        id="searchInput"
        placeholder="Search videos...">

        <button id="voiceBtn">
            🎤
        </button>

    </div>

</div>

      <i class="fa-solid fa-magnifying-glass" id="searchBtn"> </i>

      <i class="fa-solid fa-bell"></i>

      <div class="profile">
        J
      </div>

    </div>


    



    

  </header>







  <!-- CATEGORY -->

  <section class="category-section">

    <button class="active">All</button>
    <button>Bhakti</button>
    <button>Gujarati</button>
    <button>Motivation</button>
    <button>Katha</button>
    <button>Comedy</button>

  </section>









  <!-- VIDEOS -->

  <div
    class="videos-container"
    id="videosContainer">
  </div>




    








  <!-- VIDEO POPUP -->

  <div class="video-popup" id="videoPopup">

    <div class="popup-content">

      <div class="close-btn" onclick="closeVideo()">

        <i class="fa-solid fa-xmark"></i>

      </div>





      <div class="popup-video">

        <iframe
          id="youtubePlayer"
          src=""
          frameborder="0"

          allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          fullscreen;
          allowfullscreen;
          playsinline=0;
          web-share"
          playsinline=0

          allowfullscreen

          webkitallowfullscreen
          mozallowfullscreen>

        </iframe>

      </div>

    </div>

  </div>






  <!-- JS -->

  <script type="module" src="script.js"></script>

</body>
</html>
