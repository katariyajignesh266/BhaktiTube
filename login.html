<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BhaktiTube Login</title>

    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">

        <div class="logo">🔐</div>

        <h1 class="title">
            BhaktiTube Admin
        </h1>

        <input
        type="email"
        id="email"
        placeholder="Enter Email">

        <input
        type="password"
        id="password"
        placeholder="Enter Password">

        <button onclick="login()">
            Login
        </button>

        <p class="footer">
            Secure Admin Access
        </p>

    </div>

    <link rel="stylesheet" href="Login.css">

</body>
</html>
