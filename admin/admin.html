<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BhaktiTube Admin</title>

<link rel="stylesheet" href="admin.css">

</head>
<body>

<body>

<div class="admin-wrapper">

```
<div class="container">

    <h1>🎬 BhaktiTube Admin Panel</h1>

    <form id="videoForm">

        <input type="text" id="youtubeUrl" placeholder="Paste YouTube Video URL">

        <button type="button" id="fetchBtn"> Fetch Details </button>

        <input type="text" id="videoId" placeholder="YouTube Video ID" required>

        <input type="text" id="title" placeholder="Video Title" required>

        <input type="text" id="channel" placeholder="Channel Name" required>

        <input type="text" id="logo" placeholder="Logo Letter" required>

        <input type="text" id="views" placeholder="Views" required>

        <input type="text" id="date" placeholder="Date" required>

        <button type="submit">
            Upload Video
        </button>

    </form>

    <hr style="margin:30px 0;border-color:#333;">

<h2>📢 Advertisement Upload</h2>

<form id="adForm">

<input
type="text"
id="adTitle"
placeholder="Advertisement Title"
required>

<input
type="text"
id="adVideoUrl"
placeholder="Advertisement Video URL"
required>

<input
type="text"
id="adRedirectLink"
placeholder="Website / PlayStore Link"
required>

<input
type="number"
id="adSkipAfter"
placeholder="Skip After Seconds"
value="5">

<button type="submit">
Upload Advertisement
</button>

</form>

</div>



<div class="videos-panel">

    <h2 id="toggleAds" class="toggle-title">
📢 Manage Advertisements ▼
</h2>

<div id="adsList"></div>

    <hr style="margin:30px 0;border-color:#333;">

    <h2 id="toggleVideos" class="toggle-title">
📹 Manage Videos ▼
</h2>

<div id="videosList"></div>
</div>


</div>

<script type="module" src="admin.js"></script>

</body>
</html>
