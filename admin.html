<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BhaktiTube Admin</title>

<link rel="stylesheet" href="admin.css">

</head>
<body>

<div class="container">

<h1>BhaktiTube Admin Panel</h1>

<form id="videoForm">

<input
type="text"
id="videoId"
placeholder="YouTube Video ID"
required
>

<input
type="text"
id="title"
placeholder="Video Title"
required
>

<input
type="text"
id="channel"
placeholder="Channel Name"
required
>

<input
type="text"
id="logo"
placeholder="Logo Letter"
required
>

<input
type="text"
id="views"
placeholder="Views"
required
>

<input
type="text"
id="date"
placeholder="Date"
required
>

<button type="submit">
Upload Video
</button>

</form>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
